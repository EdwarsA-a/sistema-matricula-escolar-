services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: matricula_escolar
      MYSQL_USER: matricula_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Completa MYSQL_ROOT_PASSWORD en .env}
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_catalogos.sql:/docker-entrypoint-initdb.d/02_catalogos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/matricula_escolar?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: matricula_app
      DB_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD en .env}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  setup:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: [setup]
    working_dir: /project
    volumes: [".:/project", "maven_cache:/root/.m2"]
    environment:
      DB_URL: jdbc:mysql://db:3306/matricula_escolar?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: matricula_app
      DB_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db: {condition: service_healthy}
    command: ["mvn", "compile", "exec:java", "-Dexec.mainClass=pe.edu.matricula.tools.BootstrapAdmin"]
volumes:
  mysql_data:
  maven_cache:
